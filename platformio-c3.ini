[platformio]
default_envs = esp32-c3-dev

[env:esp32-c3-dev]
platform = espressif32@7.0.1
board = esp32-c3-devkitm-1
framework = arduino
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = qio
board_build.flash_size = 4MB
monitor_speed = 115200
monitor_filters = time

lib_deps =
    fastled/FastLED @ ^3.9.12
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.3

build_flags =
    ; 注意：ESP32-C3 没有 PSRAM，以下标志全部移除
    ; -DBOARD_HAS_PSRAM
    ; -DCONFIG_SPIRAM_SUPPORT
    ; -DCONFIG_SPIRAM_MODE_OCT=1
    ; -DCONFIG_SPIRAM_TYPE_ESPPSRAM64=1
    ; -DCONFIG_SPIRAM_SIZE=8
    ; -DESP32S3
    ; Arduino-C3 原生 USB（如果开发板有 USB）
    -DARDUINO_USB_CDC_ON_BOOT=1
